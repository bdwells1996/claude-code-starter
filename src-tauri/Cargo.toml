[package]
name = "natter"
version = "0.1.0"
description = "Local push-to-talk speech transcription for macOS"
authors = []
edition = "2021"

[lib]
name = "natter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "natter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
